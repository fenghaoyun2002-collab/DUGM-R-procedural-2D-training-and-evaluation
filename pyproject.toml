[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dugm-r-2d"
version = "0.1.0"
description = "DUGM nominal navigation and risk-triggered recovery in procedural 2D"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29,<1.2",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "stable-baselines3>=2.3,<3",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dugm-r = "dugm_r.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dugm_r = ["configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
